<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RShop - Set Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px 12px 0 0;
            padding: 30px 20px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .card-header p {
            margin: 0;
            opacity: 0.95;
            font-size: 14px;
        }

        .card-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #f0f8ff;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
            background-color: #dc2626;
        }

        .password-strength-text {
            font-size: 12px;
            margin-top: 5px;
            color: #6b7280;
        }

        .password-requirements {
            background: #f0f8ff;
            border: 1px solid #93c5fd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #1e40af;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }

        .requirement-item:last-child {
            margin-bottom: 0;
        }

        .requirement-check {
            width: 16px;
            height: 16px;
            border: 2px solid #93c5fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .requirement-check.done {
            background-color: #16a34a;
            border-color: #16a34a;
            color: white;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            background: var(--secondary);
        }

        .btn-submit:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .alert-info {
            background-color: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .skip-btn {
            text-align: center;
            margin-top: 15px;
        }

        .skip-btn a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .skip-btn a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

        <div class="card">
            <div class="card-header">
                <h1><i class="fas fa-lock"></i> Set Your Password</h1>
                <p>Create a password for traditional email/password login</p>
            </div>
            <div class="card-body">
                <div id="error-alert" class="alert alert-error"></div>
                <div id="success-alert" class="alert alert-success"></div>
                <div id="info-alert" class="alert alert-info"></div>

                <form id="set-password-form">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strength-bar"></div>
                        </div>
                        <div class="password-strength-text" id="strength-text">Password strength: —</div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" required>
                    </div>

                    <div class="form-group">
                        <label for="username">New Username (Optional)</label>
                        <input type="text" id="username" name="username" placeholder="Choose a new username (min 3 characters)">
                        <small style="color: #6b7280;">Leave blank to keep your current username</small>
                    </div>

                    <div class="password-requirements">
                        <strong style="display: block; margin-bottom: 10px;">Password Requirements:</strong>
                        <div class="requirement-item">
                            <div class="requirement-check" id="check-length">
                                <i class="fas fa-check"></i>
                            </div>
                            <span>At least 6 characters</span>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-check" id="check-upper">
                                <i class="fas fa-check"></i>
                            </div>
                            <span>One uppercase letter (A-Z)</span>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-check" id="check-number">
                                <i class="fas fa-check"></i>
                            </div>
                            <span>One number (0-9)</span>
                        </div>
                        <div class="requirement-item">
                            <div class="requirement-check" id="check-match">
                                <i class="fas fa-check"></i>
                            </div>
                            <span>Passwords match</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="submit-btn">
                        <span class="loading-spinner" id="spinner"></span>
                        <span id="btn-text">Set Password & Continue</span>
                    </button>
                </form>

                <div class="skip-btn">
                    <a href="/dashboard.html">Skip for Now</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ ALERT FUNCTIONS ============
        function showAlert(type, message) {
            const alertMap = {
                error: 'error-alert',
                success: 'success-alert',
                info: 'info-alert'
            };

            // Hide all alerts
            document.getElementById('error-alert').style.display = 'none';
            document.getElementById('success-alert').style.display = 'none';
            document.getElementById('info-alert').style.display = 'none';

            const alertId = alertMap[type] || 'error-alert';
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.style.display = 'block';
        }

        function clearAlerts() {
            document.getElementById('error-alert').style.display = 'none';
            document.getElementById('success-alert').style.display = 'none';
            document.getElementById('info-alert').style.display = 'none';
        }

        // ============ PASSWORD STRENGTH & VALIDATION ============
        function calculatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength += 25;
            if (password.length >= 8) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9!@#$%^&*]/.test(password)) strength += 25;
            return Math.min(strength, 100);
        }

        function getPasswordStrengthText(strength) {
            if (strength === 0) return 'Password strength: —';
            if (strength <= 25) return 'Password strength: Weak';
            if (strength <= 50) return 'Password strength: Fair';
            if (strength <= 75) return 'Password strength: Good';
            return 'Password strength: Strong';
        }

        function getPasswordStrengthColor(strength) {
            if (strength <= 25) return '#dc2626';
            if (strength <= 50) return '#f59e0b';
            if (strength <= 75) return '#3b82f6';
            return '#16a34a';
        }

        function validateRequirements() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Check length
            const hasLength = password.length >= 6;
            document.getElementById('check-length').classList.toggle('done', hasLength);

            // Check uppercase
            const hasUpper = /[A-Z]/.test(password);
            document.getElementById('check-upper').classList.toggle('done', hasUpper);

            // Check number
            const hasNumber = /[0-9]/.test(password);
            document.getElementById('check-number').classList.toggle('done', hasNumber);

            // Check match
            const isMatch = password === confirmPassword && password.length > 0;
            document.getElementById('check-match').classList.toggle('done', isMatch);

            // All requirements met
            return hasLength && hasUpper && hasNumber && isMatch;
        }

        // ============ PASSWORD INPUT EVENT ============
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strength = calculatePasswordStrength(password);
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');

            bar.style.width = strength + '%';
            bar.style.backgroundColor = getPasswordStrengthColor(strength);
            text.textContent = getPasswordStrengthText(strength);

            validateRequirements();
        });

        document.getElementById('confirm-password').addEventListener('input', () => {
            validateRequirements();
        });

        document.getElementById('username').addEventListener('input', () => {
            const username = document.getElementById('username').value;
            if (username && username.length < 3) {
                showAlert('error', 'Username must be at least 3 characters');
            } else {
                clearAlerts();
            }
        });

        // ============ FORM SUBMISSION ============
        document.getElementById('set-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearAlerts();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const username = document.getElementById('username').value.trim();

            // Validate
            if (!validateRequirements()) {
                showAlert('error', 'Please meet all password requirements');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('error', 'Passwords do not match');
                return;
            }

            if (username && username.length < 3) {
                showAlert('error', 'Username must be at least 3 characters');
                return;
            }

            // Submit
            const token = localStorage.getItem('authToken');
            if (!token) {
                showAlert('error', 'Authentication token not found. Please login again.');
                return;
            }

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('spinner').style.display = 'inline-block';

            try {
                const response = await fetch('/api/auth/set-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        password: password,
                        username: username || undefined
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert('error', data.error || 'Failed to set password');
                    document.getElementById('submit-btn').disabled = false;
                    document.getElementById('spinner').style.display = 'none';
                    return;
                }

                showAlert('success', 'Password set successfully! Redirecting to dashboard...');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 2000);

            } catch (error) {
                showAlert('error', `Error: ${error.message}`);
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('spinner').style.display = 'none';
            }
        });

        // ============ PAGE LOAD CHECK ============
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login.html';
            }
        });
    </script>
</body>
</html>
